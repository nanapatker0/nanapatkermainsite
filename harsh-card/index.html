    <style>
        /* Selection & Base Styles */
        ::selection {
            background: #D4AF37;
            color: #2A060E;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #170307;
            color: #1F1A1B;
            -webkit-tap-highlight-color: transparent;
        }

        /* Luxury Ambient Gradient Texture */
        .bg-grain {
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.2), transparent 70%),
                              radial-gradient(circle at 80% 50%, rgba(82, 16, 29, 0.45), transparent 55%);
        }

        /* Shimmer Effect for Primary Gold CTA */
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 30%,
                rgba(255, 255, 255, 0.45) 50%,
                transparent 70%
            );
            transform: rotate(30deg) translateX(-100%);
            animation: shimmerEffect 4s infinite linear;
        }

        @keyframes shimmerEffect {
            0% { transform: rotate(30deg) translateX(-150%); }
            20% { transform: rotate(30deg) translateX(150%); }
            100% { transform: rotate(30deg) translateX(150%); }
        }

        /* Staggered Animations */
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.08s; }
        .delay-2 { animation-delay: 0.16s; }
        .delay-3 { animation-delay: 0.24s; }

        /* Modal Overlay Smooth Fade */
        .modal-active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        /* Tactile Press Feedback */
        .active-tap:active {
            transform: scale(0.97);
        }
    </style>
</head>

            const img = document.createElement('img');
            img.src = PROFILE.avatarUrl;
            img.alt = `${PROFILE.firstName} ${PROFILE.lastName}`;
            img.className = "w-full h-full object-cover";
            img.onerror = function() {
                renderMonogramFallback(avatarContainer);
            };
            avatarContainer.appendChild(img);
        }

        function renderMonogramFallback(container) {
            if (!container) container = document.getElementById('avatar-container');
            const initials = `${PROFILE.firstName.charAt(0)}${PROFILE.lastName.charAt(0)}`;
            container.innerHTML = `<span class="font-serif text-3xl font-bold tracking-widest text-gold">${initials}</span>`;
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = '';

            PROFILE.links.forEach(link => {
                const card = document.createElement('a');
                card.href = link.url;
                if (!link.url.startsWith('mailto:')) {
                    card.target = "_blank";
                    card.rel = "noopener noreferrer";
                }
                card.className = "active-tap group flex items-center justify-between p-3.5 rounded-2xl bg-white border border-ivory-border shadow-sm hover:border-gold hover:shadow-gold-subtle transition-all duration-300";

                card.innerHTML = `
                    <div class="flex items-center space-x-3.5 min-w-0">
                        <div class="w-10 h-10 rounded-xl bg-ivory text-maroon group-hover:bg-maroon group-hover:text-gold flex items-center justify-center shrink-0 transition-colors duration-300">
                            ${link.icon}
                        </div>
                        <div class="text-left truncate">
                            <h3 class="text-sm font-bold text-maroon group-hover:text-gold-dark transition-colors">${link.title}</h3>
                            <p class="text-xs text-maroon-light/70 font-normal truncate leading-tight">${link.subtitle}</p>
                        </div>
                    </div>
                    <div class="text-maroon-light/40 group-hover:text-gold group-hover:translate-x-1 transition-all duration-300 shrink-0 ml-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setupQuickActions() {
            document.getElementById('btn-call').href = `tel:${PROFILE.phone}`;
            
            const waGreeting = encodeURIComponent(PROFILE.whatsappMessage);
            document.getElementById('btn-whatsapp').href = `https://wa.me/${PROFILE.whatsapp}?text=${waGreeting}`;
            
            const emailSubject = encodeURIComponent(`NFC Contact Card Connection`);
            document.getElementById('btn-email').href = `mailto:${PROFILE.workEmail}?subject=${emailSubject}`;
        }

        /**
         * ==========================================
         * vCARD 3.0 EXPORTER (.vcf)
         * Downloads: Harsh_Pandey_Harvisha_Pictures.vcf
         * ==========================================
         */
        function downloadVCard() {
            const vCardData = 
`BEGIN:VCARD
VERSION:3.0
N:${PROFILE.lastName};${PROFILE.firstName};;;
FN:${PROFILE.firstName} ${PROFILE.lastName}
ORG:${PROFILE.company}
TITLE:${PROFILE.role}
TEL;TYPE=CELL:${PROFILE.phone}
EMAIL;TYPE=WORK:${PROFILE.workEmail}
EMAIL;TYPE=HOME:${PROFILE.personalEmail}
URL:${PROFILE.website}
ADR;TYPE=WORK:;;;${PROFILE.location};;;India
NOTE:Wedding Photography & Event Cinematography | Instagram: ${PROFILE.instagramHandle}
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
            const fileName = `Harsh_Pandey_Harvisha_Pictures.vcf`;

            if (navigator.msSaveBlob) {
                navigator.msSaveBlob(blob, fileName);
            } else {
                const link = document.createElement('a');
                if (link.download !== undefined) {
                    const url = URL.createObjectURL(blob);
                    link.setAttribute('href', url);
                    link.setAttribute('download', fileName);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    showToast('Contact file ready! Tap to save.');
                } else {
                    showToast('Unable to download vCard on this browser.');
                }
            }
        }

        /**
         * ==========================================
         * SMART SHARE & CLIPBOARD FALLBACK
         * ==========================================
         */
        function shareCard() {
            const shareData = {
                title: `${PROFILE.firstName} ${PROFILE.lastName} | ${PROFILE.company}`,
                text: `${PROFILE.tagline}`,
                url: window.location.href.startsWith('http') ? window.location.href : PROFILE.website
            };

            if (navigator.share) {
                navigator.share(shareData)
                    .catch(() => {
                        // Dismissed share sheet
                    });
            } else {
                copyCurrentURL();
            }
        }

        function copyCurrentURL() {
            const targetUrl = window.location.href.startsWith('http') ? window.location.href : PROFILE.website;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(targetUrl)
                    .then(() => showToast('Card link copied to clipboard!'))
                    .catch(() => fallbackCopyTextToClipboard(targetUrl));
            } else {
                fallbackCopyTextToClipboard(targetUrl);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.top = '0';
            textArea.style.left = '0';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('Card link copied to clipboard!');
                } else {
                    showToast('Failed to copy link.');
                }
            } catch (err) {
                showToast('Copying not supported on this browser.');
            }
            document.body.removeChild(textArea);
        }

        /**
         * ==========================================
         * QR CODE GENERATOR & MODAL
         * ==========================================
         */
        function generateQRCode() {
            const targetUrl = window.location.href.startsWith('http') ? window.location.href : PROFILE.website;
            const qrcodeContainer = document.getElementById("qrcode-target");
            qrcodeContainer.innerHTML = "";

            new QRCode(qrcodeContainer, {
                text: targetUrl,
                width: 170,
                height: 170,
                colorDark: "#2A060E",
                colorLight: "#FFFFFF",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function toggleQRModal(show) {
            const modal = document.getElementById('qr-modal');
            const content = document.getElementById('qr-modal-content');

            if (show) {
                modal.classList.add('modal-active');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            } else {
                modal.classList.remove('modal-active');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
            }
        }

        /**
         * ==========================================
         * TOAST NOTIFICATION CONTROLLER
         * ==========================================
         */
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');

            toastMessage.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
